# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - LICENSE

permissions:
  contents: read

jobs:
  check:
    name: CI
    uses: kirchDev/workflows/.github/workflows/_ci-check.yml@f81bbe5fb5e8055b55a1ef5f861cc63a8e253622 # v0.1.3

  go:
    name: Go
    uses: kirchDev/workflows/.github/workflows/_ci-go.yml@f81bbe5fb5e8055b55a1ef5f861cc63a8e253622 # v0.1.3
