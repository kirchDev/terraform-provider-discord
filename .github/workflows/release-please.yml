# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The Terraform Registry reads this repo's tags, and GoReleaser uploads the
# signed artifacts onto the release release-please cuts.

name: Release Please

on:
  push:
    branches:
      - main

jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write
      pull-requests: write
    uses: kirchDev/workflows/.github/workflows/_release-please.yml@7fd4eaf529500fcd07c527ae70c839ab9ac7d76f # v0.7.0
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  goreleaser:
    name: GoReleaser
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: write
    uses: kirchDev/workflows/.github/workflows/_publish-goreleaser.yml@7fd4eaf529500fcd07c527ae70c839ab9ac7d76f # v0.7.0
    with:
      tag-name: ${{ needs.release-please.outputs.tag-name }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
