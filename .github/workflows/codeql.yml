# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '34 23 * * 0'
  workflow_dispatch:

jobs:
  codeql:
    name: CodeQL
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: kirchDev/workflows/.github/workflows/_codeql.yml@4767c07534dcf886d6a387f29dc70a097b44c591 # v0.14.0
    with:
      languages: '["actions", "go", "javascript-typescript"]'
