# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The triggers stay here because a reusable workflow cannot be dispatched — the
# approval gate therefore remains in the repo it protects.
name: Fast-forward Queue

on:
  push:
    branches:
      - 'ai/queue-**'
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Queue PR number to land; empty considers every open queue PR'
        required: false
        type: string

jobs:
  fast-forward-queue:
    name: Fast-forward Queue
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    uses: kirchDev/workflows/.github/workflows/_fast-forward-queue.yml@94cbcbd676b989ac6c6327055a240132f5cd76a5 # v0.8.0
    with:
      pr: ${{ inputs.pr }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
