# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The body reads the integration branch off the pull request's own base, so the
# `branches:` filter below is the only place it is named.
name: Queue Branch

on:
  pull_request:
    branches:
      - dev
    types: [opened]

jobs:
  queue-branch:
    name: Queue Branch
    permissions:
      contents: read
      pull-requests: write
    uses: kirchDev/workflows/.github/workflows/_queue-branch.yml@94cbcbd676b989ac6c6327055a240132f5cd76a5 # v0.8.0
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
